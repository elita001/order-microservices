name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest # has Docker, which testcontainers needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests (PostgreSQL, RabbitMQ)
        run: go test -tags integration -race -count=1 ./...

  # Protobuf contracts of the gRPC APIs: lint, formatting, generated code up to date, and,
  # on pull requests, no changes that break existing clients (compared with the base branch).
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking reads the base branch from the git history
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.59.0 # keep in sync with BUF_VERSION in the Makefile
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Formatting
        run: buf format -d --exit-code
      - name: Check that the generated code is up to date
        run: |
          buf generate
          if [ -n "$(git status --porcelain -- gen)" ]; then
            git status --short -- gen
            echo "::error::Generated code is out of date: run 'make proto' and commit gen/."
            exit 1
          fi
      - name: Breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:proto" 2>/dev/null; then
            buf breaking --against ".git#ref=$BASE_SHA"
          else
            echo "The base branch has no proto/ yet: nothing to compare with."
          fi

  # Dashboards are code: the committed JSON must be exactly what cmd/dashboards generates.
  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate dashboards
        run: go run ./cmd/dashboards
      - name: Check that the committed dashboards are up to date
        run: |
          if ! git diff --exit-code -- deploy/grafana/dashboards; then
            echo "::error::Dashboards are out of date: run 'make dashboards' and commit the JSON files."
            exit 1
          fi

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Prometheus configuration and alert rules
        run: >
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alert rule tests
        run: >
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" -w /etc/prometheus
          prom/prometheus:v3.5.0 test rules alerts_test.yml
      - name: Alloy configuration
        run: >
          docker run --rm -e COMPOSE_PROJECT=ci -v "$PWD/deploy/alloy:/etc/alloy:ro"
          grafana/alloy:v1.10.2 fmt /etc/alloy/config.alloy

  build:
    needs: [lint, test, proto]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, order, customer, payment, delivery, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: orderflow/${{ matrix.service }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

# Local development environment. Values come from .env (see .env.example);
# compose fails with a clear message if a required variable is missing.

# One database for all services, but each service owns its tables and migrations.
x-database-url: &database-url "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
x-rabbitmq-url: &rabbitmq-url "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"

x-migrate: &migrate
  image: migrate/migrate:v4.17.1
  depends_on:
    postgres:
      condition: service_healthy

# Telemetry settings of every Go service: traces go to Alloy over OTLP, errors to GlitchTip.
# SENTRY_DSN can point to sentry.io instead; the key below is created by glitchtip-init.
x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  SENTRY_DSN: ${SENTRY_DSN:-http://${GLITCHTIP_DSN_KEY}@glitchtip:8000/1}
  SENTRY_ENVIRONMENT: development

# Access token verification (the gateway and every service with an API). The issuer is the
# public URL clients get tokens from; the keys are fetched over the internal network.
x-auth-env: &auth-env
  OIDC_ISSUER: "http://localhost:${KEYCLOAK_PORT:-8180}/realms/orderflow"
  OIDC_JWKS_URL: "http://keycloak:8080/realms/orderflow/protocol/openid-connect/certs"
  OIDC_AUDIENCE: orderflow-api

# Settings shared by the services that consume events.
x-consumer-env: &consumer-env
  <<: *telemetry-env
  RABBITMQ_URL: *rabbitmq-url
  POSTGRES_DSN: *database-url
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CONSUMER_RETRY_DELAYS: ${CONSUMER_RETRY_DELAYS:-1s,5s,30s,2m,10m}

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1" # a separate Redis database
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?copy .env.example to .env}
  GLITCHTIP_DOMAIN: "http://localhost:${GLITCHTIP_PORT:-8000}"
  DEFAULT_FROM_EMAIL: glitchtip@orderflow.local
  EMAIL_URL: consolemail://
  ENABLE_USER_REGISTRATION: "false"
  ENABLE_ORGANIZATION_CREATION: "false"

x-service: &service
  build:
    context: .
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, which has these variables.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # A fixed hostname keeps the node name stable, otherwise data in the volume is lost on recreate.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672" # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Rate limits, idempotency keys, and the order cache: every key has a TTL, and nothing
  # needs to survive a restart (PostgreSQL is the source of truth for all of it).
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env}
    command:
      - sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider: issues the access tokens (OAuth 2.0 / OpenID Connect). The realm with
  # its roles, client, and test users is imported from deploy/keycloak on startup.
  # Development mode keeps data in memory: the realm is re-imported on every start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?copy .env.example to .env}
      # Tokens carry this issuer however Keycloak is reached (browser, curl, or the
      # services over the internal network), so it matches the services' OIDC_ISSUER.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Secrets of the services' own clients, substituted into the imported realm file.
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?copy .env.example to .env}
      CUSTOMER_CLIENT_SECRET: ${CUSTOMER_CLIENT_SECRET:?copy .env.example to .env}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      # The image has no curl or wget: bash talks HTTP to the management port directly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Fake SMTP server: catches all emails and shows them in a web UI.
  mailpit:
    image: axllent/mailpit:v1.27
    user: "65534:65534" # nobody: the image would run as root, and Mailpit needs no privileges
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Each service has its own migrations and version table, so they evolve independently.
  # (The order service keeps the default schema_migrations table for compatibility.)
  migrate-order:
    <<: *migrate
    volumes:
      - ./migrations/order:/migrations
    command: ["-path=/migrations", "-database", *database-url, "up"]

  migrate-payment:
    <<: *migrate
    volumes:
      - ./migrations/payment:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&x-migrations-table=payment_schema_migrations"
      - "up"

  migrate-delivery:
    <<: *migrate
    volumes:
      - ./migrations/delivery:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&x-migrations-table=delivery_schema_migrations"
      - "up"

  migrate-notification:
    <<: *migrate
    volumes:
      - ./migrations/notification:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&x-migrations-table=notification_schema_migrations"
      - "up"

  migrate-customer:
    <<: *migrate
    volumes:
      - ./migrations/customer:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&x-migrations-table=customer_schema_migrations"
      - "up"

  # The only entry point for external clients: REST outside, gRPC to the services.
  gateway:
    <<: *service
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      <<: [*telemetry-env, *auth-env]
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORDER_GRPC_ADDR: "order:9081"
      CUSTOMER_GRPC_ADDR: "customer:9085"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      RATE_LIMIT_READ_RPS: ${RATE_LIMIT_READ_RPS:-50}
      RATE_LIMIT_READ_BURST: ${RATE_LIMIT_READ_BURST:-100}
      RATE_LIMIT_WRITE_RPS: ${RATE_LIMIT_WRITE_RPS:-5}
      RATE_LIMIT_WRITE_BURST: ${RATE_LIMIT_WRITE_BURST:-10}
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Redis and the services are not required to start: the gateway fails open without
    # Redis and returns 502 while a service is down (gRPC reconnects on its own).
    depends_on:
      redis:
        condition: service_started

  # The services do not strictly need RabbitMQ at startup: the outbox and the consumers
  # reconnect on their own. Waiting for it only keeps startup logs clean.
  # Their ports are published for debugging only; clients go through the gateway.
  order:
    <<: *service
    build:
      context: .
      args:
        SERVICE: order
    environment:
      <<: [*consumer-env, *auth-env]
      GRPC_ADDR: ":9081"
      GRPC_REFLECTION: "true" # lets grpcurl list the API; development only
      HTTP_ADDR: ":8081" # metrics and probes
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CACHE_TTL: ${ORDER_CACHE_TTL:-5m}
    ports:
      - "${ORDER_GRPC_PORT:-9081}:9081"
      - "${ORDER_HTTP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-order:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  # Customer profiles: local copies of Keycloak users, read over gRPC by the gateway
  # (GET /api/v1/customers/me) and the notification service (recipients' emails).
  customer:
    <<: *service
    build:
      context: .
      args:
        SERVICE: customer
    environment:
      <<: [*telemetry-env, *auth-env]
      POSTGRES_DSN: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GRPC_ADDR: ":9085"
      GRPC_REFLECTION: "true"
      HTTP_ADDR: ":8085"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_ID: customer-service
      KEYCLOAK_CLIENT_SECRET: ${CUSTOMER_CLIENT_SECRET:?copy .env.example to .env}
      PROFILE_REFRESH_AFTER: ${CUSTOMER_PROFILE_REFRESH_AFTER:-1h}
    ports:
      - "${CUSTOMER_GRPC_PORT:-9085}:9085"
      - "${CUSTOMER_HTTP_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Keycloak is not required to start: profiles already copied are served while it is down.
    depends_on:
      migrate-customer:
        condition: service_completed_successfully

  payment:
    <<: *service
    build:
      context: .
      args:
        SERVICE: payment
    environment:
      <<: *consumer-env
      HTTP_ADDR: ":8082"
      PAYMENT_STUB_FAILURE_RATE: ${PAYMENT_STUB_FAILURE_RATE:-0.2}
      PAYMENT_STUB_ERROR_RATE: ${PAYMENT_STUB_ERROR_RATE:-0}
      PAYMENT_STUB_MIN_DELAY: ${PAYMENT_STUB_MIN_DELAY:-100ms}
      PAYMENT_STUB_MAX_DELAY: ${PAYMENT_STUB_MAX_DELAY:-1s}
    ports:
      - "${PAYMENT_HTTP_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-payment:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  delivery:
    <<: *service
    build:
      context: .
      args:
        SERVICE: delivery
    environment:
      <<: *consumer-env
      HTTP_ADDR: ":8083"
      DELIVERY_STUB_ERROR_RATE: ${DELIVERY_STUB_ERROR_RATE:-0.1}
      DELIVERY_STUB_MIN_DELAY: ${DELIVERY_STUB_MIN_DELAY:-100ms}
      DELIVERY_STUB_MAX_DELAY: ${DELIVERY_STUB_MAX_DELAY:-500ms}
    ports:
      - "${DELIVERY_HTTP_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-delivery:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification:
    <<: *service
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      <<: *consumer-env
      HTTP_ADDR: ":8084"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CUSTOMER_GRPC_ADDR: "customer:9085"
      # The service's own client: it reads customer profiles with its own token.
      OIDC_TOKEN_URL: "http://keycloak:8080/realms/orderflow/protocol/openid-connect/token"
      OIDC_CLIENT_ID: notification-service
      OIDC_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?copy .env.example to .env}
    ports:
      - "${NOTIFICATION_HTTP_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-notification:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Monitoring. Configuration lives in deploy/: scrape targets and alert rules for
  # Prometheus, the data source and dashboards for Grafana (provisioned on startup).
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle # POST /-/reload re-reads the configuration
      # Stores a 0 when a counter is created, so increase() does not lose the first events
      # of a series that appears with a non-zero value (e.g., right after a service starts).
      - --enable-feature=created-timestamp-zero-ingestion
      # Tempo writes the service graph metrics here (Prometheus remote write protocol).
      - --web.enable-remote-write-receiver
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?copy .env.example to .env}
      # Anyone can view dashboards locally without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Viewers may use Explore (ad-hoc log and trace queries); dashboards stay read-only
      # because they are provisioned from files.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  # Logs: Alloy reads the containers' stdout and pushes it to Loki.
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  # Traces: the services send spans to Alloy, which forwards them to Tempo.
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./deploy/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempodata:/var/tempo
    restart: unless-stopped

  # Alloy never touches the Docker socket: access to it equals root on the host, even when
  # mounted read-only (":ro" protects the socket file, not the API, which can start a
  # privileged container). It runs as the unprivileged "alloy" user and reads container
  # lists and logs through docker-socket-proxy.
  alloy:
    image: grafana/alloy:v1.10.2
    user: "473:473" # the image's "alloy" user; the image would run as root by default
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME} # collect logs of this project only
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data # read positions in the logs survive restarts
    networks: [default, docker-api]
    ports:
      - "${ALLOY_UI_PORT:-12345}:12345"
    depends_on:
      - loki
      - tempo
      - docker-socket-proxy
    restart: unless-stopped

  # The only container with the Docker socket. It allows a minimal read-only part of the
  # API (listing containers and networks, reading logs) and rejects everything else,
  # including any POST. It is reachable only from the internal docker-api network: container
  # details include environment variables with passwords.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped

  # Error tracking: GlitchTip is a lightweight, Sentry-compatible server (the services use
  # the official sentry-go SDK). It keeps its data in its own database of the shared PostgreSQL.
  glitchtip-db:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command:
      - sh
      - -c
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'glitchtip'" | grep -q 1 || psql -c "CREATE DATABASE glitchtip"
    depends_on:
      postgres:
        condition: service_healthy

  # Migrations and the admin user, organization, and project with the DSN key from .env.
  glitchtip-init:
    image: glitchtip/glitchtip:v5.1.1
    environment:
      <<: *glitchtip-env
      GLITCHTIP_ADMIN_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:-admin@orderflow.local}
      GLITCHTIP_ADMIN_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:?copy .env.example to .env}
      GLITCHTIP_DSN_KEY: ${GLITCHTIP_DSN_KEY:?copy .env.example to .env}
    command: ["sh", "-c", "./manage.py migrate --no-input && ./manage.py shell < /bootstrap/bootstrap.py"]
    volumes:
      - ./deploy/glitchtip/bootstrap.py:/bootstrap/bootstrap.py:ro
    depends_on:
      glitchtip-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:v5.1.1
    command: ["./bin/run-all-in-one.sh"] # web server and background workers in one process
    environment: *glitchtip-env
    ports:
      - "${GLITCHTIP_PORT:-8000}:8000"
    depends_on:
      glitchtip-init:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default:
  # Only Alloy and the Docker API proxy are attached; "internal" means no outside access.
  docker-api:
    internal: true

volumes:
  alloydata:
  pgdata:
  rabbitmqdata:
  promdata:
  lokidata:
  tempodata:

# Local development environment. Values come from .env (see .env.example);
# compose fails with a clear message if a required variable is missing.

# One database for all services, but each service owns its tables and migrations.
x-database-url: &database-url "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
x-rabbitmq-url: &rabbitmq-url "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"

x-migrate: &migrate
  image: migrate/migrate:v4.17.1
  depends_on:
    postgres:
      condition: service_healthy

x-service: &service
  build:
    context: .
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, which has these variables.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # A fixed hostname keeps the node name stable, otherwise data in the volume is lost on recreate.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672" # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Rate limits, idempotency keys, and the order cache: every key has a TTL, and nothing
  # needs to survive a restart (PostgreSQL is the source of truth for all of it).
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy .env.example to .env}
    command:
      - sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake SMTP server: catches all emails and shows them in a web UI.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Each service has its own migrations and version table, so they evolve independently.
  # (The order service keeps the default schema_migrations table for compatibility.)
  migrate-order:
    <<: *migrate
    volumes:
      - ./migrations/order:/migrations
    command: ["-path=/migrations", "-database", *database-url, "up"]

  migrate-payment:
    <<: *migrate
    volumes:
      - ./migrations/payment:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&x-migrations-table=payment_schema_migrations"
      - "up"

  migrate-delivery:
    <<: *migrate
    volumes:
      - ./migrations/delivery:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&x-migrations-table=delivery_schema_migrations"
      - "up"

  migrate-notification:
    <<: *migrate
    volumes:
      - ./migrations/notification:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&x-migrations-table=notification_schema_migrations"
      - "up"

  # The only entry point for external clients.
  gateway:
    <<: *service
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORDER_SERVICE_URL: "http://order:8081"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      RATE_LIMIT_READ_RPS: ${RATE_LIMIT_READ_RPS:-50}
      RATE_LIMIT_READ_BURST: ${RATE_LIMIT_READ_BURST:-100}
      RATE_LIMIT_WRITE_RPS: ${RATE_LIMIT_WRITE_RPS:-5}
      RATE_LIMIT_WRITE_BURST: ${RATE_LIMIT_WRITE_BURST:-10}
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Redis and the order service are not required to start: the gateway fails open
    # without Redis and returns 502 while the order service is down.
    depends_on:
      redis:
        condition: service_started

  # The services do not strictly need RabbitMQ at startup: the outbox and the consumers
  # reconnect on their own. Waiting for it only keeps startup logs clean.
  # Their ports are published for debugging only; clients go through the gateway.
  order:
    <<: *service
    build:
      context: .
      args:
        SERVICE: order
    environment:
      HTTP_ADDR: ":8081"
      POSTGRES_DSN: *database-url
      RABBITMQ_URL: *rabbitmq-url
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CACHE_TTL: ${ORDER_CACHE_TTL:-5m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${ORDER_HTTP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-order:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  payment:
    <<: *service
    build:
      context: .
      args:
        SERVICE: payment
    environment:
      HTTP_ADDR: ":8082"
      POSTGRES_DSN: *database-url
      RABBITMQ_URL: *rabbitmq-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PAYMENT_STUB_FAILURE_RATE: ${PAYMENT_STUB_FAILURE_RATE:-0.2}
      PAYMENT_STUB_MIN_DELAY: ${PAYMENT_STUB_MIN_DELAY:-100ms}
      PAYMENT_STUB_MAX_DELAY: ${PAYMENT_STUB_MAX_DELAY:-1s}
    ports:
      - "${PAYMENT_HTTP_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-payment:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  delivery:
    <<: *service
    build:
      context: .
      args:
        SERVICE: delivery
    environment:
      HTTP_ADDR: ":8083"
      POSTGRES_DSN: *database-url
      RABBITMQ_URL: *rabbitmq-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DELIVERY_STUB_ERROR_RATE: ${DELIVERY_STUB_ERROR_RATE:-0.1}
      DELIVERY_STUB_MIN_DELAY: ${DELIVERY_STUB_MIN_DELAY:-100ms}
      DELIVERY_STUB_MAX_DELAY: ${DELIVERY_STUB_MAX_DELAY:-500ms}
    ports:
      - "${DELIVERY_HTTP_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-delivery:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification:
    <<: *service
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      HTTP_ADDR: ":8084"
      POSTGRES_DSN: *database-url
      RABBITMQ_URL: *rabbitmq-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "${NOTIFICATION_HTTP_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate-notification:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmqdata:

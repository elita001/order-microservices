services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations
    command: ["-path=/migrations", "-database=postgres://app:app@postgres:5432/orderflow?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  order:
    build:
      context: .
      args:
        SERVICE: order
    environment:
      HTTP_ADDR: ":8081"
      POSTGRES_DSN: "postgres://app:app@postgres:5432/orderflow?sslmode=disable"
      LOG_LEVEL: debug
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:

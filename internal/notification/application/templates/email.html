<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>{{.Subject}}</title></head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr><td style="padding:24px 32px;border-bottom:1px solid #e4e7eb;font-size:18px;font-weight:bold;">OrderFlow</td></tr>
    <tr><td style="padding:24px 32px;">
      <h1 style="margin:0 0 16px;font-size:22px;">{{.Heading}}</h1>
      {{range .Lines}}<p style="margin:0 0 12px;font-size:15px;line-height:1.5;">{{.}}</p>
      {{end}}
    </td></tr>
    <tr><td style="padding:16px 32px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">This is an automated message, please do not reply.</td></tr>
  </table>
</body>
</html>

# Alert rules. They are visible in Prometheus (http://localhost:9090/alerts); routing them
# to Slack or email would need Alertmanager, which is out of scope for local development.
#
# Ratio alerts also require a minimum volume: with 2 requests, one error is already 50%,
# which says nothing about the service. Tests: alerts_test.yml (`make test-alerts`).
groups:
  - name: orderflow-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"gateway|order|payment|delivery|notification"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} for 1 minute."

      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
              / sum by (job) (rate(http_requests_total[5m])) > 0.05
          )
          and sum by (job) (increase(http_requests_total[5m])) >= 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of requests fail with 5xx"

      # p95 of a handful of requests is just the slowest one.
      - alert: SlowRequests
        expr: |
          (
            histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 1
          )
          and sum by (job) (increase(http_request_duration_seconds_count[5m])) >= 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }}: p95 latency is {{ $value | humanizeDuration }}"

  - name: orderflow-messaging
    rules:
      # Every message here is a failed business operation: an order that will not be paid,
      # shipped, or notified until someone looks at it.
      - alert: DeadLetterQueueNotEmpty
        expr: rabbitmq_detailed_queue_messages{queue=~".*[.]dlq"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} message(s) in {{ $labels.queue }}"
          description: >-
            Inspect with `make dlq-list queue={{ reReplaceAll "[.]dlq$" "" $labels.queue }}`,
            fix the cause, then `make dlq-replay queue={{ reReplaceAll "[.]dlq$" "" $labels.queue }}`.

      - alert: OutboxLagging
        expr: outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.table }}: events are {{ $value | humanizeDuration }} late"
          description: "The outbox relay cannot publish: is RabbitMQ available?"

      - alert: ConsumerPaused
        expr: messaging_consumer_paused == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} stopped consuming {{ $labels.queue }}: its database is unavailable"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }}: circuit breaker {{ $labels.name }} is open"

  - name: orderflow-business
    rules:
      - alert: HighPaymentDeclineRate
        expr: |
          (
            sum(rate(payments_total{status="failed"}[15m])) / sum(rate(payments_total[15m])) > 0.5
          )
          and sum(increase(payments_total[15m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of payments are declined"

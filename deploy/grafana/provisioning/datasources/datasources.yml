apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus # dashboards reference the data source by this uid
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # A trace_id in a log line becomes a link to the trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # From a span to the logs written while handling it (all services of the trace).
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service=~".+"} | trace_id="$${__trace.traceId}"'
      # The service map is built from the metrics Tempo writes to Prometheus.
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

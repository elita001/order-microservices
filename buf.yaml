# Protobuf contracts of the internal gRPC APIs (buf.build). `make proto` lints and
# regenerates the Go code in gen/; CI also rejects breaking changes against main.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE # field numbers, names, and types stay compatible for old clients and stored data
